[package]
name = "nixe-tasks"
version = "0.1.0"
description = "A task manager for Omarchy: processes, live performance graphs, startup items and services"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-tasks"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-tasks"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
